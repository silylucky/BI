[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalspan-backend"
version = "0.1.0"
description = "VitalSpan BI platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "apscheduler>=3.10.0",
    "bcrypt>=4.0.0",
    "pymysql>=1.1.0",
    "gmssl>=3.2.2",
    "elasticsearch>=8.0.0",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "httpx>=0.28.0",
    "openai>=1.54.0",
    "python-multipart>=0.0.20",
    "lark-oapi>=1.4.0",
    "dingtalk-sdk>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
]
connectors-ext = [
    "pyhive>=0.7.0",
    "pymssql>=2.3.0",
    "oracledb>=2.5.0",
    "clickhouse-connect>=0.7.0",
    "dmPython>=2.5.0",
    "trino>=0.330.0",
    "pymongo>=4.6.0",
    "influxdb-client>=1.40.0",
    "taospy>=2.7.0",
    "opensearch-py>=2.4.0",
    "openpyxl>=3.1.0",
    "thrift>=0.16.0",
    "thrift_sasl>=0.4.0",
    "pure-sasl>=0.6.0",
]
export-render = [
    "playwright>=1.49.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["../tests"]
markers = [
    "integration: M7/M11 optional compose — sample-mariadb:3308 sample-clickhouse:8124; M11 optional starrocks:9030 trino:8080 influxdb:8086 tdengine:6041 timescaledb:5433 (see test_connectors_m11_r235.py)",
]
