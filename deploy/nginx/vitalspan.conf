# VitalSpan staging / demo reverse proxy (Nginx :8088)
# Install: cp deploy/nginx/vitalspan.conf /etc/nginx/sites-available/vitalspan
#
# client_max_body_size: dashboard editor-save may embed canvas background images
# as base64 in layoutJson (~1–3MB). Default nginx 1m causes HTTP 413 before
# requests reach uvicorn.

server {
    listen 8088;
    client_max_body_size 8m;
    server_name _;
    root /opt/apps/vitalspan/fe/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /template-assets/ {
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    # Hashed build assets — safe to cache long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA shell — must not be cached across deploys (avoids stale lazy-chunk 404).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
