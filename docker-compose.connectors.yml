# 可选：30 型连接器真机验收栈（与 docker-compose.yml 叠加使用）
#
#   docker compose -f docker-compose.yml -f docker-compose.connectors.yml up -d
#
# 验收：python scripts/connector-live-check.py

services:
  sample-mongodb:
    image: docker.m.daocloud.io/library/mongo:7.0
    profiles: ["connectors"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: ["connectors"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  sample-opensearch:
    image: opensearchproject/opensearch:2.15.0
    profiles: ["connectors"]
    ports:
      - "9201:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  sample-influxdb:
    image: docker.m.daocloud.io/library/influxdb:2.7
    profiles: ["connectors"]
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: vitalspan-dev-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  sample-trino:
    image: docker.m.daocloud.io/trinodb/trino:445
    profiles: ["connectors"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  sample-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["connectors"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "VitalSpan!Sa2026"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VitalSpan!Sa2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  sample-oracle:
    image: gvenzl/oracle-xe:21-slim
    profiles: ["connectors"]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: sample
      APP_USER_PASSWORD: sample
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30

  sample-tdengine:
    image: tdengine/tdengine:3.3.0.0
    profiles: ["connectors"]
    ports:
      - "6041:6041"
      - "6030:6030"
    volumes:
      - ./docker/sample-tdengine/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  sample-hive:
    image: bde2020/hive:2.3.2-postgresql-metastore
    profiles: ["connectors"]
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "beeline -u 'jdbc:hive2://localhost:10000/default' -n hive -p hive -e 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30

  hive-metastore-db:
    image: docker.m.daocloud.io/library/postgres:13-alpine
    profiles: ["connectors"]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
