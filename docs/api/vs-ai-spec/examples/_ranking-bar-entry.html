<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:transparent;overflow:hidden}#ranking-container{width:100%;height:100%;padding:20px;overflow-y:auto}#ranking-list{width:100%}.ranking-item{display:flex;align-items:center;margin-bottom:var(--bar-gap,16px);opacity:0;transform:translateX(-30px);animation:slideIn 0.5s ease forwards}.ranking-item:nth-child(1){animation-delay:0s}.ranking-item:nth-child(2){animation-delay:0.1s}.ranking-item:nth-child(3){animation-delay:0.2s}.ranking-item:nth-child(n+4){animation-delay:calc(0.2s + (var(--item-index,0) - 3) * 0.05s)}@keyframes slideIn{to{opacity:1;transform:translateX(0)}}.rank-badge{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;font-size:14px;margin-right:12px;flex-shrink:0;background:#e2e8f0;color:#64748b}.rank-badge.top1{background:linear-gradient(135deg,#ffd700,#ffed4a);color:#92400e;box-shadow:0 2px 8px rgba(245,158,11,0.4)}.rank-badge.top2{background:linear-gradient(135deg,#e2e8f0,#f1f5f9);color:#475569;box-shadow:0 2px 8px rgba(148,163,184,0.4)}.rank-badge.top3{background:linear-gradient(135deg,#fdba74,#fb923c);color:#92400e;box-shadow:0 2px 8px rgba(217,119,6,0.4)}.bar-wrapper{flex:1;display:flex;align-items:center;min-width:0}.bar-label{font-size:14px;color:var(--text-primary,#1e293b);margin-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;flex-shrink:0}.bar-track{flex:1;height:var(--bar-height,32px);background:rgba(0,0,0,0.05);border-radius:calc(var(--bar-height,32px)/2);position:relative;overflow:hidden;min-width:60px}.bar-fill{height:100%;border-radius:calc(var(--bar-height,32px)/2);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;transition:width var(--animation-duration,1000ms) ease-out;position:relative;overflow:hidden}.bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shimmer 2s infinite}.bar-fill.top1{background:linear-gradient(90deg,#fbbf24,#f59e0b)}.bar-fill.top2{background:linear-gradient(90deg,#cbd5e1,#94a3b8)}.bar-fill.top3{background:linear-gradient(90deg,#fdba74,#d97706)}.bar-fill.normal{background:linear-gradient(90deg,#60a5fa,#3b82f6)}@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.bar-value{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.2)}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#94a3b8}.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.5}.empty-state p{font-size:14px}</style></head><body><div id="ranking-container"><div id="ranking-list"></div></div><script>(function(){var host=document.currentScript&&document.currentScript.parentElement;var STYLE={},DATA=[],MAX_VALUE=0;function readPayload(){if(host&&host.vsCv&&host.vsCv.getPayload)return host.vsCv.getPayload();var n=(host||document).querySelector('.vs-cv-payload');if(!n||!n.textContent)return null;try{return JSON.parse(n.textContent)}catch(e){return null}}function readStyle(){if(host&&host.vsCv&&host.vsCv.getStyle)return host.vsCv.getStyle();var s=(host||document).querySelector('.vs-cv-style');if(!s||!s.textContent)return{};try{return JSON.parse(s.textContent)}catch(e){return{}}}function getStyleValue(key,defaultVal){return STYLE[key]!==undefined?STYLE[key]:defaultVal}function parsePayload(payload){if(!payload||!payload.rows||!payload.rows.length)return[];var cols=payload.columns||[];var nameIdx=0,valueIdx=cols.length>1?1:0;var data=[];for(var i=0;i<payload.rows.length;i++){var row=payload.rows[i];var name=row[nameIdx],val=Number(row[valueIdx]);if(!isNaN(val)){data.push({name:String(name),value:val,index:i})}}return data.sort(function(a,b){return b.value-a.value})}function formatValue(v){if(v>=100000000)return(v/100000000).toFixed(1)+'亿';if(v>=10000)return(v/10000).toFixed(1)+'万';if(v>=1000)return(v/1000).toFixed(1)+'K';return v.toLocaleString()}function getBarColor(rank){if(rank===1)return getStyleValue('top1Color','#f59e0b');if(rank===2)return getStyleValue('top2Color','#94a3b8');if(rank===3)return getStyleValue('top3Color','#d97706');return getStyleValue('barColor','#3b82f6')}function render(){var container=document.getElementById('ranking-list');var payload=readPayload();var bindingStatus=payload?payload.bindingStatus:'unbound';if(bindingStatus!=='bound'||!payload.rows||!payload.rows.length){container.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 16h5M8 8h3"/></svg><p>请在右侧绑定数据集</p></div>';return}DATA=parsePayload(payload);if(!DATA.length){container.innerHTML='<div class="empty-state"><p>暂无数据</p></div>';return}MAX_VALUE=Math.max.apply(null,DATA.map(function(d){return d.value}));var barHeight=getStyleValue('barHeight',32);var barGap=getStyleValue('barGap',16);var showValues=getStyleValue('showValues',true);var showRankBadge=getStyleValue('showRankBadge',true);var animDuration=getStyleValue('animationDuration',1000);container.style.setProperty('--bar-height',barHeight+'px');container.style.setProperty('--bar-gap',barGap+'px');container.style.setProperty('--animation-duration',animDuration+'ms');var html='';DATA.forEach(function(item,i){var rank=i+1;var widthPercent=(item.value/MAX_VALUE)*100;var rankClass=rank===1?'top1':rank===2?'top2':rank===3?'top3':'normal';var badgeHtml=showRankBadge?'<div class="rank-badge '+rankClass+'">'+rank+'</div>':'';var valueHtml=showValues?'<span class="bar-value">'+formatValue(item.value)+'</span>':'';html+='<div class="ranking-item" style="--item-index:'+i+'">'+badgeHtml+'<div class="bar-wrapper"><span class="bar-label" title="'+item.name+'">'+item.name+'</span><div class="bar-track"><div class="bar-fill '+rankClass+'" style="width:0%;background:'+getBarColor(rank)+'">'+valueHtml+'</div></div></div></div>'});container.innerHTML=html;setTimeout(function(){var bars=container.querySelectorAll('.bar-fill');bars.forEach(function(bar,i){bar.style.width=(DATA[i].value/MAX_VALUE*100)+'%'})},100)}function attachListeners(){if(host&&host.classList&&host.classList.contains('vs-custom-viz-host')){host.addEventListener('vs-cv-payload-update',render);host.addEventListener('vs-cv-style-update',function(){STYLE=readStyle();render()})}}STYLE=readStyle();render();attachListeners()})();</script></body></html>
