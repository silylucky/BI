<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gov-grid-bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <radialGradient id="gov-grid-glow" cx="50%" cy="0%" r="55%">
      <stop stop-color="#8c8c8c" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gov-grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#595959" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#gov-grid-bg)"/>
  <rect width="1920" height="1080" fill="url(#gov-grid-glow)"/>
  <rect width="1920" height="1080" fill="url(#gov-grid-dots)"/>
  <rect width="1920" height="3" fill="#595959" opacity="0.35"/>
</svg>