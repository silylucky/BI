<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="canvas-blue-band-bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#e8ecf1"/>
    </linearGradient>
    <radialGradient id="canvas-blue-band-glow" cx="50%" cy="0%" r="55%">
      <stop stop-color="#1890ff" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="canvas-blue-band-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1890ff" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#canvas-blue-band-bg)"/>
  <rect width="1920" height="1080" fill="url(#canvas-blue-band-glow)"/>
  <rect y="0" width="1920" height="56" fill="#1890ff" opacity="0.06"/>
    <line x1="0" y1="56" x2="1920" y2="56" stroke="#1890ff" stroke-width="1" opacity="0.2"/>
  <rect width="1920" height="3" fill="#1890ff" opacity="0.35"/>
</svg>