<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="canvas-coral-mesh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#fff1f0"/>
    </linearGradient>
    <radialGradient id="canvas-coral-mesh-glow" cx="50%" cy="0%" r="55%">
      <stop stop-color="#ff4d4f" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="canvas-coral-mesh-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ff4d4f" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#canvas-coral-mesh-bg)"/>
  <rect width="1920" height="1080" fill="url(#canvas-coral-mesh-glow)"/>
  <radialGradient id="canvas-coral-mesh-mesh" cx="80%" cy="20%" r="60%">
      <stop stop-color="#ff7875" stop-opacity="0.08"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <rect width="1920" height="1080" fill="url(#canvas-coral-mesh-mesh)"/>
  <rect width="1920" height="3" fill="#ff4d4f" opacity="0.35"/>
</svg>