<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="canvas-gold-dots-bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#fffbe6"/>
    </linearGradient>
    <radialGradient id="canvas-gold-dots-glow" cx="50%" cy="0%" r="55%">
      <stop stop-color="#d48806" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="canvas-gold-dots-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#d48806" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#canvas-gold-dots-bg)"/>
  <rect width="1920" height="1080" fill="url(#canvas-gold-dots-glow)"/>
  <rect width="1920" height="1080" fill="url(#canvas-gold-dots-dots)"/>
  <rect width="1920" height="3" fill="#d48806" opacity="0.35"/>
</svg>