<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="canvas-slate-stripes-bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <radialGradient id="canvas-slate-stripes-glow" cx="50%" cy="0%" r="55%">
      <stop stop-color="#8c8c8c" stop-opacity="0.07"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="canvas-slate-stripes-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#595959" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#canvas-slate-stripes-bg)"/>
  <rect width="1920" height="1080" fill="url(#canvas-slate-stripes-glow)"/>
  <pattern id="canvas-slate-stripes-stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#595959" stroke-width="1" opacity="0.05"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#canvas-slate-stripes-stripes)"/>
  <rect width="1920" height="3" fill="#595959" opacity="0.35"/>
</svg>