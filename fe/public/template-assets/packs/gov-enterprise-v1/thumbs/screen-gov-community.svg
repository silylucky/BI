<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
  <g transform="scale(0.16666666666666666 0.16666666666666666)">
  
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a78bfa" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  </g>
</svg>